<div class="login-wrapper">
  <div class="card login-card">
    <h1>Iniciar sesión</h1>
    <p class="muted">Panel DummyJSON</p>

    <!-- *ngIf: muestra el elemento solo si la condición es verdadera -->
    <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <!-- [formGroup] enlaza este <form> con el FormGroup del .ts
         (ngSubmit) ejecuta onSubmit() al enviar
         novalidate desactiva la validación nativa del navegador (usamos la de Angular) -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="username">Usuario</label>
        <!-- formControlName enlaza el input con el campo "username" del FormGroup
             [class.is-invalid] agrega la clase solo cuando isInvalid() es true -->
        <input
          id="username"
          type="text"
          class="form-control"
          formControlName="username"
          [class.is-invalid]="isInvalid('username')"
          autocomplete="username"
        />
        <div class="error-text" *ngIf="hasError('username', 'required')">El usuario es obligatorio.</div>
        <div class="error-text" *ngIf="hasError('username', 'minlength')">Debe tener mínimo 6 caracteres.</div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          [class.is-invalid]="isInvalid('password')"
          autocomplete="current-password"
        />
        <div class="error-text" *ngIf="hasError('password', 'required')">La contraseña es obligatoria.</div>
        <div class="error-text" *ngIf="hasError('password', 'minlength')">Debe tener mínimo 6 caracteres.</div>
      </div>

      <!-- [disabled] evita doble envío mientras carga -->
      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
